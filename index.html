<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a1a0a">
<meta name="description" content="Ganit Sathi – Calculator, Currency Converter, Unit Converter, Age Calculator">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ganit Sathi 🔢</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a1a0a; --surface: #0f2b0f; --surface2: #1a3d1a;
    --border: rgba(134,239,172,0.15); --accent: #4ade80; --accent2: #86efac;
    --text: #dcfce7; --muted: #4b7a55;
    --btn-num: #162b16; --btn-op: #1e4a1e; --btn-eq: #4ade80;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  [data-theme="light"] { --bg: #f0fdf4; --surface: #fff; --surface2: #dcfce7; --text: #14532d; --muted: #6b7280; --btn-num: #f0fdf4; --btn-op: #dcfce7; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px; }
  .view { display: none; } .view.active { display: block; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 16px; border-radius: 12px; cursor: pointer; border: none; background: none; color: var(--muted); font-family: var(--font); transition: all 0.2s; }
  .nav-item.active { color: var(--accent); }
  .nav-item span { font-size: 10px; font-weight: 600; }
  .nav-item svg { width: 22px; height: 22px; }

  /* CALCULATOR */
  .calc-wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 420px; margin: 0 auto; }
  .calc-display { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 20px; text-align: right; }
  .calc-expr { font-size: 14px; color: var(--muted); min-height: 20px; word-break: break-all; }
  .calc-result { font-size: 48px; font-weight: 900; color: var(--accent2); letter-spacing: -2px; word-break: break-all; }
  .sci-toggle { display: flex; gap: 8px; justify-content: flex-end; }
  .toggle-btn { padding: 6px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .toggle-btn.active { background: var(--accent); color: #0a1a0a; border-color: var(--accent); }
  .sci-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .btn { height: 64px; border-radius: 18px; border: none; font-size: 18px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 0.12s; color: var(--text); }
  .btn:active { transform: scale(0.94); }
  .btn-num { background: var(--btn-num); border: 1px solid var(--border); }
  .btn-op { background: var(--btn-op); color: var(--accent2); }
  .btn-fn { background: var(--surface2); color: var(--accent); font-size: 13px; }
  .btn-eq { background: var(--btn-eq); color: #0a1a0a; font-size: 22px; }
  .btn-clear { background: rgba(239,68,68,0.2); color: #f87171; }
  .btn-span2 { grid-column: span 2; }
  .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .history-item { background: var(--surface2); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; font-size: 14px; cursor: pointer; }
  .history-item:hover { background: var(--btn-op); }

  /* CURRENCY */
  .curr-wrap { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .curr-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 20px; }
  .curr-card label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: block; }
  .curr-row { display: flex; gap: 10px; align-items: center; }
  .curr-input { flex: 1; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 22px; font-weight: 700; font-family: var(--font); outline: none; }
  .curr-select { padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; font-weight: 700; font-family: var(--font); outline: none; cursor: pointer; min-width: 90px; }
  .swap-btn { width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .swap-btn:active { transform: rotate(180deg); }
  .convert-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--accent); color: #0a1a0a; font-size: 16px; font-weight: 800; cursor: pointer; font-family: var(--font); }
  .curr-result { text-align: center; padding: 20px; background: var(--surface2); border-radius: 16px; }
  .curr-result-val { font-size: 36px; font-weight: 900; color: var(--accent2); }
  .curr-result-rate { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .curr-rates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .rate-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .rate-chip-code { font-size: 12px; font-weight: 700; color: var(--accent); }
  .rate-chip-val { font-size: 15px; font-weight: 700; }
  .section-header { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

  /* UNIT CONVERTER */
  .unit-wrap { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .unit-cat { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .unit-cat::-webkit-scrollbar { display: none; }
  .cat-chip { padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: var(--font); transition: all 0.2s; flex-shrink: 0; }
  .cat-chip.active { background: var(--accent); color: #0a1a0a; border-color: var(--accent); }
  .unit-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 20px; }
  .unit-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .unit-field:last-child { margin-bottom: 0; }
  .unit-row { display: flex; gap: 10px; }
  .unit-input { flex: 1; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 20px; font-weight: 700; font-family: var(--font); outline: none; }
  .unit-input:focus { border-color: var(--accent); }
  .unit-select { padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 600; font-family: var(--font); outline: none; cursor: pointer; }

  /* AGE CALC */
  .age-wrap { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .age-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 24px; }
  .age-card label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; display: block; }
  .date-input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; font-family: var(--font); outline: none; }
  .date-input:focus { border-color: var(--accent); }
  .age-calc-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--accent); color: #0a1a0a; font-size: 16px; font-weight: 800; cursor: pointer; font-family: var(--font); }
  .age-result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .age-unit { background: var(--surface2); border-radius: 16px; padding: 16px; text-align: center; }
  .age-unit-val { font-size: 32px; font-weight: 900; color: var(--accent2); }
  .age-unit-key { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .age-extra { display: flex; flex-direction: column; gap: 8px; }
  .age-extra-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .age-extra-key { font-size: 13px; color: var(--muted); }
  .age-extra-val { font-size: 15px; font-weight: 700; color: var(--accent2); }
  .status-msg { text-align: center; padding: 12px; font-size: 13px; color: var(--muted); }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-theme="dark">
<div class="topbar">
  <div class="topbar-brand">
    <span style="font-size:22px">🔢</span>
    <div>
      <div class="topbar-title">Ganit Sathi</div>
      <div class="topbar-sub">Calculator • Currency • Units • Age</div>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn">🌙</button>
</div>

<div class="main">

  <!-- CALCULATOR VIEW -->
  <div class="view active" id="view-calc">
    <div class="calc-wrap">
      <div class="calc-display">
        <div class="calc-expr" id="calcExpr">&nbsp;</div>
        <div class="calc-result" id="calcResult">0</div>
      </div>
      <div class="sci-toggle">
        <button class="toggle-btn active" id="btnBasic" onclick="setMode('basic')">Basic</button>
        <button class="toggle-btn" id="btnSci" onclick="setMode('sci')">Scientific</button>
      </div>
      <div class="sci-row" id="sciRow" style="display:none">
        <button class="btn btn-fn" onclick="calcFn('sin')">sin</button>
        <button class="btn btn-fn" onclick="calcFn('cos')">cos</button>
        <button class="btn btn-fn" onclick="calcFn('tan')">tan</button>
        <button class="btn btn-fn" onclick="calcFn('log')">log</button>
        <button class="btn btn-fn" onclick="calcFn('ln')">ln</button>
        <button class="btn btn-fn" onclick="calcFn('sqrt')">√</button>
        <button class="btn btn-fn" onclick="calcFn('pow2')">x²</button>
        <button class="btn btn-fn" onclick="calcFn('pi')">π</button>
      </div>
      <div class="calc-grid">
        <button class="btn btn-clear" onclick="clearCalc()">AC</button>
        <button class="btn btn-op" onclick="calcInput('(')">(</button>
        <button class="btn btn-op" onclick="calcInput(')')">)</button>
        <button class="btn btn-op" onclick="calcInput('%')">%</button>
        <button class="btn btn-num" onclick="calcInput('7')">7</button>
        <button class="btn btn-num" onclick="calcInput('8')">8</button>
        <button class="btn btn-num" onclick="calcInput('9')">9</button>
        <button class="btn btn-op" onclick="calcInput('/')">÷</button>
        <button class="btn btn-num" onclick="calcInput('4')">4</button>
        <button class="btn btn-num" onclick="calcInput('5')">5</button>
        <button class="btn btn-num" onclick="calcInput('6')">6</button>
        <button class="btn btn-op" onclick="calcInput('*')">×</button>
        <button class="btn btn-num" onclick="calcInput('1')">1</button>
        <button class="btn btn-num" onclick="calcInput('2')">2</button>
        <button class="btn btn-num" onclick="calcInput('3')">3</button>
        <button class="btn btn-op" onclick="calcInput('-')">−</button>
        <button class="btn btn-num" onclick="calcInput('0')">0</button>
        <button class="btn btn-num" onclick="calcInput('.')">.</button>
        <button class="btn btn-op" onclick="backspace()">⌫</button>
        <button class="btn btn-op" onclick="calcInput('+')">+</button>
        <button class="btn btn-eq btn-span2" onclick="evaluate()">=</button>
        <button class="btn btn-fn btn-span2" onclick="toggleSign()">+/−</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="section-header">History</div>
        <button class="toggle-btn" onclick="clearHistory()">Clear</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- CURRENCY VIEW -->
  <div class="view" id="view-currency">
    <div class="curr-wrap">
      <div class="curr-card">
        <label>Amount</label>
        <div class="curr-row">
          <input class="curr-input" id="currAmount" type="number" value="1" oninput="convertCurr()">
          <select class="curr-select" id="fromCurr" onchange="convertCurr()">
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
      <div style="display:flex;justify-content:center">
        <button class="swap-btn" onclick="swapCurr()">⇅</button>
      </div>
      <div class="curr-card">
        <label>Converted To</label>
        <div class="curr-row">
          <div style="flex:1;padding:14px 16px;background:var(--surface2);border-radius:14px;border:1.5px solid var(--border)">
            <div id="currConverted" style="font-size:22px;font-weight:900;color:var(--accent2)">–</div>
          </div>
          <select class="curr-select" id="toCurr" onchange="convertCurr()">
            <option value="INR">INR</option>
          </select>
        </div>
        <div id="currRate" class="curr-result-rate" style="margin-top:8px">Loading rates...</div>
      </div>
      <div class="section-header">Popular Rates (vs INR)</div>
      <div class="curr-rates" id="popularRates"></div>
    </div>
  </div>

  <!-- UNITS VIEW -->
  <div class="view" id="view-units">
    <div class="unit-wrap">
      <div class="unit-cat" id="unitCats"></div>
      <div class="unit-card" id="unitConverter"></div>
    </div>
  </div>

  <!-- AGE VIEW -->
  <div class="view" id="view-age">
    <div class="age-wrap">
      <div class="age-card">
        <label>Apni Janam Tarikh</label>
        <input class="date-input" type="date" id="birthDate" max="">
        <br><br>
        <label>Reference Date (default: Aaj)</label>
        <input class="date-input" type="date" id="refDate">
        <br><br>
        <button class="age-calc-btn" onclick="calculateAge()">🎂 Umar Calculate Karo</button>
      </div>
      <div id="ageResult" style="display:none">
        <div class="section-header">Tumhari Umar</div>
        <div class="age-result" id="ageMain"></div>
        <div class="section-header" style="margin-top:8px">Aur Bhi Details</div>
        <div class="age-extra" id="ageExtra"></div>
      </div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="calc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h4"/></svg>
    <span>Calculator</span>
  </button>
  <button class="nav-item" data-view="currency">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9.354a4 4 0 100 5.292M12 7v10"/></svg>
    <span>Currency</span>
  </button>
  <button class="nav-item" data-view="units">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h4v4H3zM17 3h4v4h-4zM3 17h4v4H3zM17 17h4v4h-4zM7 5h10M5 7v10M19 7v10M7 19h10"/></svg>
    <span>Units</span>
  </button>
  <button class="nav-item" data-view="age">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span>Age</span>
  </button>
</nav>

<script>
// ===================== CALCULATOR =====================
let expr = '', mode = 'basic';
const disp = () => document.getElementById('calcResult');
const exprEl = () => document.getElementById('calcExpr');
let history = JSON.parse(localStorage.getItem('ganit-history') || '[]');

function setMode(m) {
  mode = m;
  document.getElementById('btnBasic').classList.toggle('active', m === 'basic');
  document.getElementById('btnSci').classList.toggle('active', m === 'sci');
  document.getElementById('sciRow').style.display = m === 'sci' ? 'grid' : 'none';
}
function calcInput(v) {
  const map = { '/': '/', '*': '*', '-': '-', '+': '+', '%': '%' };
  expr += v;
  updateCalcDisplay();
}
function clearCalc() { expr = ''; disp().textContent = '0'; exprEl().textContent = ' '; }
function backspace() { expr = expr.slice(0, -1); updateCalcDisplay(); }
function toggleSign() {
  if (!expr) return;
  expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
  updateCalcDisplay();
}
function calcFn(fn) {
  const v = parseFloat(expr) || 0;
  const map = {
    sin: Math.sin(v * Math.PI / 180), cos: Math.cos(v * Math.PI / 180),
    tan: Math.tan(v * Math.PI / 180), log: Math.log10(v),
    ln: Math.log(v), sqrt: Math.sqrt(v), pow2: v * v, pi: Math.PI
  };
  if (fn === 'pi') expr = String(Math.PI);
  else if (expr) expr = String(map[fn]);
  else expr = '';
  updateCalcDisplay();
}
function updateCalcDisplay() {
  exprEl().textContent = expr || ' ';
  try {
    const safe = expr.replace(/[^0-9+\-*/.()%]/g, '');
    if (safe) disp().textContent = smartFormat(eval(safe));
  } catch {}
}
function evaluate() {
  try {
    const safe = expr.replace(/[^0-9+\-*/.()%]/g, '');
    const res = eval(safe);
    const formatted = smartFormat(res);
    exprEl().textContent = expr + ' =';
    disp().textContent = formatted;
    history.unshift({ expr, result: formatted });
    if (history.length > 20) history.pop();
    localStorage.setItem('ganit-history', JSON.stringify(history));
    renderHistory();
    expr = String(res);
  } catch { disp().textContent = 'Error'; expr = ''; }
}
function smartFormat(n) {
  if (!isFinite(n)) return 'Error';
  if (Number.isInteger(n)) return n.toLocaleString();
  return parseFloat(n.toFixed(10)).toLocaleString();
}
function clearHistory() { history = []; localStorage.setItem('ganit-history', '[]'); renderHistory(); }
function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) { el.innerHTML = '<div class="status-msg">Koi history nahi.</div>'; return; }
  el.innerHTML = history.map(h =>
    `<div class="history-item" onclick="expr='${h.result.replace(/,/g,'')}';updateCalcDisplay()">
      <span style="color:var(--muted)">${h.expr}</span>
      <span style="color:var(--accent2);font-weight:700">${h.result}</span>
    </div>`
  ).join('');
}
renderHistory();

// ===================== CURRENCY =====================
let rates = {};
const POPULAR = ['USD','EUR','GBP','AED','SGD','JPY','CNY','AUD'];
async function loadRates() {
  try {
    document.getElementById('currRate').textContent = '⏳ Rates load ho rahe hain...';
    const res = await fetch('https://api.frankfurter.app/latest?from=INR');
    const d = await res.json();
    rates = d.rates;
    rates['INR'] = 1;
    // Build currency options
    const fromEl = document.getElementById('fromCurr');
    const toEl = document.getElementById('toCurr');
    const allCurr = Object.keys(rates).sort();
    fromEl.innerHTML = allCurr.map(c => `<option value="${c}" ${c==='USD'?'selected':''}>${c}</option>`).join('');
    toEl.innerHTML = allCurr.map(c => `<option value="${c}" ${c==='INR'?'selected':''}>${c}</option>`).join('');
    convertCurr();
    renderPopularRates();
  } catch(e) {
    document.getElementById('currRate').textContent = '⚠️ Rates nahi aaye. Internet check karo.';
  }
}
function convertCurr() {
  const from = document.getElementById('fromCurr').value;
  const to = document.getElementById('toCurr').value;
  const amount = parseFloat(document.getElementById('currAmount').value) || 0;
  if (!rates[from] || !rates[to]) return;
  const inINR = amount / rates[from];
  const result = inINR * rates[to];
  document.getElementById('currConverted').textContent = result.toLocaleString('en-IN', { maximumFractionDigits: 4 });
  const rate = rates[to] / rates[from];
  document.getElementById('currRate').textContent = `1 ${from} = ${rate.toFixed(6)} ${to} • Source: ECB via Frankfurter (Free)`;
}
function swapCurr() {
  const from = document.getElementById('fromCurr').value;
  const to = document.getElementById('toCurr').value;
  document.getElementById('fromCurr').value = to;
  document.getElementById('toCurr').value = from;
  convertCurr();
}
function renderPopularRates() {
  const el = document.getElementById('popularRates');
  el.innerHTML = POPULAR.filter(c => rates[c]).map(c => {
    const rate = rates[c]; // rate of c vs INR (INR base), so 1 INR = rate c, 1 c = 1/rate INR
    const display = c === 'INR' ? 1 : (1 / rate).toFixed(4);
    return `<div class="rate-chip"><div class="rate-chip-code">${c}/INR</div><div class="rate-chip-val">₹${display}</div></div>`;
  }).join('');
}
loadRates();

// ===================== UNIT CONVERTER =====================
const UNITS = {
  'Length': {
    units: ['km','m','cm','mm','mile','yard','foot','inch','nautical mile'],
    toBase: { km:1000, m:1, cm:0.01, mm:0.001, mile:1609.344, yard:0.9144, foot:0.3048, inch:0.0254, 'nautical mile':1852 }
  },
  'Weight': {
    units: ['kg','g','mg','ton','lb','oz','quintal'],
    toBase: { kg:1, g:0.001, mg:0.000001, ton:1000, lb:0.453592, oz:0.0283495, quintal:100 }
  },
  'Temperature': { units: ['°C','°F','K'], special: true },
  'Volume': {
    units: ['liter','ml','gallon','quart','pint','cup','fl oz','cubic m'],
    toBase: { liter:1, ml:0.001, gallon:3.78541, quart:0.946353, pint:0.473176, cup:0.2366, 'fl oz':0.0295735, 'cubic m':1000 }
  },
  'Area': {
    units: ['sq m','sq km','hectare','sq mile','acre','sq ft','sq in'],
    toBase: { 'sq m':1, 'sq km':1e6, hectare:10000, 'sq mile':2589988.11, acre:4046.86, 'sq ft':0.092903, 'sq in':0.00064516 }
  },
  'Speed': {
    units: ['km/h','m/s','mph','knot'],
    toBase: { 'km/h':1/3.6, 'm/s':1, mph:0.44704, knot:0.514444 }
  },
  'Data': {
    units: ['bit','byte','KB','MB','GB','TB'],
    toBase: { bit:0.125, byte:1, KB:1024, MB:1048576, GB:1073741824, TB:1099511627776 }
  }
};

let unitCat = 'Length', unitFrom = '', unitTo = '';

function renderUnitCats() {
  const el = document.getElementById('unitCats');
  el.innerHTML = Object.keys(UNITS).map(c =>
    `<button class="cat-chip ${c===unitCat?'active':''}" onclick="setUnitCat('${c}')">${c}</button>`
  ).join('');
}

function setUnitCat(cat) {
  unitCat = cat;
  const units = UNITS[cat].units;
  unitFrom = units[0]; unitTo = units[1];
  renderUnitCats();
  renderUnitConverter();
}

function renderUnitConverter() {
  const cat = UNITS[unitCat];
  const options = u => cat.units.map(uu => `<option value="${uu}" ${uu===u?'selected':''}>${uu}</option>`).join('');
  document.getElementById('unitConverter').innerHTML = `
    <div class="unit-field">
      <div class="unit-row">
        <input class="unit-input" id="unitIn" type="number" placeholder="Value" oninput="doConvert()">
        <select class="unit-select" id="unitFromSel" onchange="unitFrom=this.value;doConvert()">${options(unitFrom)}</select>
      </div>
    </div>
    <div style="text-align:center;color:var(--accent);font-size:24px;margin:4px 0">⇅</div>
    <div class="unit-field">
      <div class="unit-row">
        <input class="unit-input" id="unitOut" readonly placeholder="Result" style="color:var(--accent2)">
        <select class="unit-select" id="unitToSel" onchange="unitTo=this.value;doConvert()">${options(unitTo)}</select>
      </div>
    </div>
  `;
}

function doConvert() {
  const val = parseFloat(document.getElementById('unitIn').value);
  const from = document.getElementById('unitFromSel').value;
  const to = document.getElementById('unitToSel').value;
  const out = document.getElementById('unitOut');
  if (isNaN(val)) { out.value = ''; return; }
  const cat = UNITS[unitCat];
  let result;
  if (cat.special) { // Temperature
    if (from === '°C' && to === '°F') result = val * 9/5 + 32;
    else if (from === '°F' && to === '°C') result = (val - 32) * 5/9;
    else if (from === '°C' && to === 'K') result = val + 273.15;
    else if (from === 'K' && to === '°C') result = val - 273.15;
    else if (from === '°F' && to === 'K') result = (val - 32) * 5/9 + 273.15;
    else if (from === 'K' && to === '°F') result = (val - 273.15) * 9/5 + 32;
    else result = val;
  } else {
    const base = val * cat.toBase[from];
    result = base / cat.toBase[to];
  }
  out.value = parseFloat(result.toPrecision(10));
}

renderUnitCats();
renderUnitConverter();

// ===================== AGE CALCULATOR =====================
document.getElementById('refDate').value = new Date().toISOString().split('T')[0];
document.getElementById('birthDate').max = new Date().toISOString().split('T')[0];

function calculateAge() {
  const birth = new Date(document.getElementById('birthDate').value);
  const ref = new Date(document.getElementById('refDate').value);
  if (!document.getElementById('birthDate').value || birth > ref) {
    alert('Sahi date dalo!'); return;
  }
  let y = ref.getFullYear() - birth.getFullYear();
  let m = ref.getMonth() - birth.getMonth();
  let d = ref.getDate() - birth.getDate();
  if (d < 0) { m--; d += new Date(ref.getFullYear(), ref.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const totalDays = Math.floor((ref - birth) / 86400000);
  const totalMonths = y * 12 + m;
  const totalHours = totalDays * 24;
  const totalMinutes = totalHours * 60;
  const nextBday = new Date(ref.getFullYear(), birth.getMonth(), birth.getDate());
  if (nextBday <= ref) nextBday.setFullYear(nextBday.getFullYear() + 1);
  const daysToNext = Math.ceil((nextBday - ref) / 86400000);
  const dayOfWeek = birth.toLocaleDateString('hi-IN', { weekday: 'long' });
  document.getElementById('ageMain').innerHTML = `
    <div class="age-unit"><div class="age-unit-val">${y}</div><div class="age-unit-key">Saal</div></div>
    <div class="age-unit"><div class="age-unit-val">${m}</div><div class="age-unit-key">Mahine</div></div>
    <div class="age-unit"><div class="age-unit-val">${d}</div><div class="age-unit-key">Din</div></div>
  `;
  document.getElementById('ageExtra').innerHTML = `
    <div class="age-extra-item"><span class="age-extra-key">📅 Kul Din</span><span class="age-extra-val">${totalDays.toLocaleString()}</span></div>
    <div class="age-extra-item"><span class="age-extra-key">📆 Kul Mahine</span><span class="age-extra-val">${totalMonths.toLocaleString()}</span></div>
    <div class="age-extra-item"><span class="age-extra-key">⏰ Kul Ghante</span><span class="age-extra-val">${totalHours.toLocaleString()}</span></div>
    <div class="age-extra-item"><span class="age-extra-key">⏱️ Kul Minutes</span><span class="age-extra-val">${totalMinutes.toLocaleString()}</span></div>
    <div class="age-extra-item"><span class="age-extra-key">🎂 Agla Birthday</span><span class="age-extra-val">${daysToNext} din baad</span></div>
    <div class="age-extra-item"><span class="age-extra-key">📌 Janam ka Din</span><span class="age-extra-val">${dayOfWeek}</span></div>
  `;
  document.getElementById('ageResult').style.display = 'block';
}
